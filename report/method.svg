ных данных</tspan></text><rect x="374.0" y="118.0" width="225.0" height="98.0" rx="10" fill="#F7F7F8" stroke="#8A8F98" stroke-width="1.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937"><tspan x="486.5" y="134.0">Прогноз</tspan><tspan x="486.5" y="156.0">федерального</tspan><tspan x="486.5" y="178.0">ряда по его</tspan><tspan x="486.5" y="200.0">длинной истории</tspan></text><rect x="374.0" y="226.0" width="225.0" height="76.0" rx="10" fill="#E9EBFA" stroke="#4C4F8C" stroke-width="2.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937"><tspan x="486.5" y="242.0">Панельный бустинг:</tspan><tspan x="486.5" y="264.0">во сколько раз</tspan><tspan x="486.5" y="286.0">изменится</tspan></text><rect x="374.0" y="312.0" width="225.0" height="76.0" rx="10" fill="#E9EBFA" stroke="#4C4F8C" stroke-width="2.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937"><tspan x="486.5" y="328.0">Двухэтапная модель:</tspan><tspan x="486.5" y="350.0">top-down по</tspan><tspan x="486.5" y="372.0">историческим долям</tspan></text><rect x="374.0" y="419.0" width="225.0" height="76.0" rx="10" fill="#F7F7F8" stroke="#8A8F98" stroke-width="1.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937"><tspan x="486.5" y="435.0">Детекторы в</tspan><tspan x="486.5" y="457.0">расширяющемся окне</tspan><tspan x="486.5" y="479.0">на темпах роста</tspan></text><rect x="684.0" y="269.0" width="200.0" height="76.0" rx="10" fill="#F7F7F8" stroke="#8A8F98" stroke-width="1.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937"><tspan x="784.0" y="285.0">Скользящий origin:</tspan><tspan x="784.0" y="3