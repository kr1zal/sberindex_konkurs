ных данных</tspan></text><rect x="374.0" y="118.0" width="225.0" height="98.0" rx="10" fill="#F7F7F8" stroke="#8A8F98" stroke-width="1.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937"><tspan x="486.5" y="134.0">Прогноз</tspan><tspan x="486.5" y="156.0">федерального</tspan><tspan x="486.5" y="178.0">ряда по его</tspan><tspan x="486.5" y="200.0">длинной истории</tspan></text><rect x="374.0" y="276.0" width="225.0" height="76.0" rx="10" fill="#E9EBFA" stroke="#4C4F8C" stroke-width="2.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937"><tspan x="486.5" y="292.0">Панельный бустинг:</tspan><tspan x="486.5" y="314.0">во сколько раз</tspan><tspan x="486.5" y="336.0">изменится</tspan></text><rect x="374.0" y="362.0" width="225.0" height="76.0" rx="10" fill="#E9EBFA" stroke="#4C4F8C" stroke-width="2.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937"><tspan x="486.5" y="378.0">Двухэтапная модель:</tspan><tspan x="486.5" y="400.0">top-down по</tspan><tspan x="486.5" y="422.0">историческим долям</tspan></text><rect x="374.0" y="469.0" width="225.0" height="76.0" rx="10" fill="#F7F7F8" stroke="#8A8F98" stroke-width="1.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937"><tspan x="486.5" y="485.0">Детекторы в</tspan><tspan x="486.5" y="507.0">расширяющемся окне</tspan><tspan x="486.5" y="529.0">на темпах роста</tspan></text><rect x="684.0" y="319.0" width="200.0" height="76.0" rx="10" fill="#F7F7F8" stroke="#8A8F98" stroke-width="1.5"/><text text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#1F2937"><tspan x="784.0" y="335.0">Скользящий origin:</tspan><tspan x="784.0" y="3