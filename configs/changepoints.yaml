# Протокол стенда разладок: шесть детекторов в потоковом протоколе (расширяющееся окно)
# на синтетических возмущениях, внесённых в реальные ряды панели, и потоковый сигнал
# по всей панели. Протокол живёт только здесь.
# Прогон: .venv/bin/python -u scripts/changepoints.py

data: { path: data/raw/mo_spending_2023-2024.parquet, category: "Все категории", max_gap: 2 }

# На каждый ряд выборки и каждую настройку детектора × режим: одна нетронутая строка
# и по одной испорченной на сочетание возмущения, величины и позиции врезки.
# Методы со штрафом гоняются на каждом штрафе сетки, CUSUM — один раз: у него свой порог.
# Штраф ядра несопоставим с методами l2 и калибруется на нетронутых рядах выборки
# в режиме realtime.mode: доля ложных тревог — как у PELT при том же номинальном штрафе;
# из точек сетки, одинаково близких к доле PELT, берётся меньший штраф — самый
# чувствительный; упор в край сетки печатается в лог строкой «ВНИМАНИЕ».
# Сетка kernel_pen_grid геометрическая: доля ложных тревог меняется с порядком штрафа.
# Стоимость rbf на отрезке из n точек не больше n − 1, окно не длиннее 24 точек, так что
# штраф 100 не пропускает ни одного излома, а 0,001 — почти любой. 120 точек — шаг ×1,10:
# при шаге ×1,34 ближайшая к PELT доля ложных тревог могла отходить от неё на несколько рядов.
bench:
  n_series: 60            # случайная выборка рядов, seed ниже
  seed: 20260920          # он же сеет дисперсионное возмущение вместе с номером ряда и позицией
  positions: [11, 14, 17] # месяцы врезки: при одной точке все задержки были бы измерены в одном месте ряда
  magnitudes: [1.0, 2.0, 4.0]
  kinds: [level, trend, variance]
  modes: [raw, ratio, deseason]
  detectors: [pelt, binseg, window, bottomup, kernel_rbf, cusum]
  penalties: [1.0, 3.0]   # сетка штрафа для методов со штрафом; правило выбора — ниже
  kernel_pen_grid: { min: 0.001, max: 100, points: 120 }  # сетка калибровки штрафа ядра
# Правило исполняет select_penalty в скрипте на детекторе и режиме из realtime; текст —
# для лога, {detector} и {mode} подставляются оттуда же, так что текст не разойдётся с делом.
selection:
  rule: "J Юдена у {detector} на режиме {mode}, среди штрафов из сетки; при равенстве — меньший штраф"

# Флаг ряда в месяц t: детектор на y[:t+1] нашёл излом в последних трёх точках —
# правило стенда. Сигнал — начало эпизода тревоги: флаг в t и ни одного флага в три
# предыдущих месяца (месяцы до первого проверяемого — без флага). Эпизод кончается
# только после трёх месяцев подряд без флага: излом считается недавним три месяца,
# и тревога живёт столько же после последнего флага. За 24 месяца у ряда может быть
# несколько эпизодов. Ограничение: события, чьи серии флагов у ряда подходят друг
# к другу ближе чем на три месяца без флага, сливаются в один эпизод — в том числе
# с ложным флагом шума перед событием; перерыв ровно в три месяца и больше — уже два
# (см. realtime_signals).
# Окно события — до следующего события; переход порога ищется в нём.
# Считается на каждом штрафе сетки; выбранный правилом отмечен в таблице событий.
realtime:
  detector: pelt
  mode: ratio
  threshold_share: 50     # доля МО с сигналом за месяц, не ниже которой месяц считается событием
  events: ["2023-10", "2024-01", "2024-10"]

output: { dir: results }
