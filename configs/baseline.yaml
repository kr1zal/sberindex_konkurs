# Протокол оценки. Меняется здесь и больше нигде — все модели считаются одинаково.
# Если организаторы опубликуют свою постановку, правится только этот файл.

data:
  path: data/raw/mo_spending_2023-2024.parquet
  category: "Все категории"
  max_gap: 2          # внутренний разрыв до 2 месяцев чиним интерполяцией, длиннее — ряд вон

split:
  horizon: 3          # месяцев вперёд
  n_folds: 3          # скользящий origin с расширяющимся окном
                      # 24 точки: обучение 15/18/21, тест 16-18/19-21/22-24

sample:
  n_series: 300       # отбор моделей идёт на стратифицированной выборке рядов
  seed: 20260919      # null = вся панель, для финального прогона

models:
  # Порядок не важен, но список должен покрывать всё, что зарегистрировано
  # в src/run.py::REGISTRY: модель, оставшаяся вне конфига, тихо выпадает
  # из итоговой таблицы сравнения, и заметить это можно только по её отсутствию.
  - naive_last
  - seasonal_naive
  - drift
  - seasonal_drift
  - ets_damped
  - ets_seasonal
  - theta
  - arima111
  - arima011
  - chronos_small
  - chronos_base
  - global_gbm
  - global_gbm_ext
  - global_gbm_factor
  - global_gbm_pretrain
  - global_gbm_cat
  - global_gbm_all
  - global_gbm_region
  - global_gbm_stack
  - global_gbm_stack_factor
  - chronos_panel
  - chronos_ft
  - chronos_ft_base
  - timesfm
  - moirai
  - two_stage
  - two_stage_sa
  - two_stage_news
  - prophet
  - prophet_forced_yearly

output:
  # Пилот на 300 рядах никогда не пишет туда же, куда полная панель. Когда писал,
  # 21.09 прогон naive_last на выборке затёр её полнопанельные строки
  # в results/per_series.csv, и сводка показала 1 908 вместо 1 852. Слияние
  # с файлом на другом множестве рядов теперь ещё и останавливается проверкой
  # (src/results_guard.py), но раздельные каталоги не доводят дело до неё.
  dir: results/baseline

compute:
  workers: 0          # 0 = все ядра минус одно
