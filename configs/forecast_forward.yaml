# Прогноз вперёд от конца панели (декабрь 2024) на 2025 год.
#
# Отличие от configs/horizons.yaml: там скользящий origin сравнивает модели
# внутри панели на исторических фолдах, здесь origin один — последний месяц
# матрицы, обучение идёт по всем 24 месяцам, а прогноз уходит за пределы панели,
# в 2025 год, которого в муниципальном разрезе ещё нет. Федеральный агрегат
# (load_aggregate) 2025-й уже знает — это разово позволяет сверить первый этап
# двухэтапной модели по факту, не дожидаясь муниципальных данных за 2025 год.
#
# Прогон: .venv/bin/python -u scripts/forecast_forward.py

data:
  path: data/raw/mo_spending_2023-2024.parquet
  category: "Все категории"
  max_gap: 2

# Последний месяц панели. Скрипт проверяет совпадение с фактическим последним
# месяцем матрицы и останавливается, если оно нарушено: обучение здесь всегда
# идёт по ВСЕМ месяцам панели (train_end = 24), а не по скользящему origin,
# и молчаливое расхождение означало бы прогноз не от того месяца.
origin: "2024-12"

horizons: [1, 3, 6, 12]

# Правило раздела отчёта «Что из этого следует для практики»: двадцать месяцев
# истории и больше, до шести месяцев вперёд — простая панельная модель с долями
# категорий; на год вперёд — двухэтапная. У h=6 обучающих моментов на ряд ровно
# столько же, сколько у h=3 в основном протоколе при обучении 21 месяц:
# train_end − k − 5 = 13 в обоих случаях (24 − 6 − 5 = 21 − 3 − 5).
recommended:
  1: global_gbm_cat
  3: global_gbm_cat
  6: global_gbm_cat
  12: two_stage

# Второй столбец на всех горизонтах — чтобы в файле было видно расхождение
# с рекомендованной моделью, а не только её число. На h=12 рекомендованная
# модель и есть two_stage: в выходе одна партия строк, а не две одинаковые.
comparison: two_stage

# Разнос ОПУБЛИКОВАННОГО федерального индекса за месяц прогноза. Единственная
# модель, которой намеренно отдаётся полный, необрезанный агрегат: СберИндекс
# публикует федеральный ряд раньше муниципального разреза, и на горизонте 1
# это настоящий наукаст, а не подглядывание. На горизонтах длиннее — оракул
# общего движения страны, нижняя граница ошибки от одного межрядового разброса.
known_aggregate: two_stage_known

output:
  dir: results
  forecast: forecast_2025.csv
  aggregate_check: forecast_2025_aggregate_check.csv
