# Протокол оценки по пяти горизонтам: наукаст и 1, 3, 6, 12 месяцев.
# Требование организаторов (ответ от 24.09.2026). Основной протокол работы —
# горизонт 3 в baseline.yaml / full.yaml; здесь то же разбиение (скользящий
# origin с расширяющимся окном, шаг равен горизонту) на каждом горизонте отдельно.
# Прогон: .venv/bin/python -u scripts/horizons.py

data:
  path: data/raw/mo_spending_2023-2024.parquet
  category: "Все категории"
  max_gap: 2

# Наукаст — это горизонт 1: внутримесячных данных в панели нет, и месяц t
# прогнозируется по данным до t−1. Вариант с известным агрегатом за месяц t
# считается отдельной моделью (two_stage_known), см. её описание.
#
# Число фолдов задаёт длину обучения в первом: 24 − n_folds × horizon.
# На горизонтах 1 и 3 первый origin тот же, что в основном протоколе (15);
# на 6 и 12 приходится начинать с 12 — иначе фолдов не остаётся вовсе.
# На горизонте 12 фолд один, и доверительных интервалов там нет по построению.
horizons:
  - horizon: 1
    n_folds: 9        # обучение 15..23, тест 16..24 по одному месяцу
  - horizon: 3
    n_folds: 3        # основной протокол: обучение 15/18/21
  - horizon: 6
    n_folds: 2        # обучение 12 и 18, тест 13-18 и 19-24
  - horizon: 12
    n_folds: 1        # обучение 12, тест 13-24 — весь 2024 год

sample:
  n_series: null      # вся панель
  seed: 20260919

# Пять типов моделей из постановки: наивная, эталон, панельная, двухэтапная,
# фундаментальная. Панельных три: базовая — для разрыва с наивной, лучшая
# по среднему и рекомендованная для практики. Сезонно-наивная добавлена потому,
# что на горизонте 12 с обучением 12 она и есть «прошлый год как он был».
models:
  - naive_last
  - seasonal_naive
  - prophet
  - two_stage
  - two_stage_known
  - global_gbm
  - global_gbm_cat
  - global_gbm_stack_factor
  - global_gbm_news
  - chronos_ft
  # Фундаментальные модели оцениваются на всех горизонтах, а не только на h=3:
  # zero-shot трёх семейств рядом с дообученным Chronos.
  - chronos_small
  - timesfm
  - moirai
  # Новости классически помогают на наукасте — здесь это горизонт 1, и проверять
  # их надо на нём, а не только в основном протоколе.
  - two_stage_news

output:
  dir: results
  prefix: horizons    # horizons_per_series.csv, horizons_steps.csv, horizons_folds.csv, horizons_summary.csv

compute:
  workers: 0          # 0 = все ядра минус одно
